name: Update Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build time into index.html
        run: |
          python3 - <<'PY'
          import datetime, pathlib, re
          p = pathlib.Path("index.html")
          s = p.read_text()
          stamp = "<!--BUILD:%s-->" % datetime.datetime.utcnow().isoformat() + "Z"
          if "<!--BUILD:" in s:
              s = re.sub(r"<!--BUILD:[^>]*-->", stamp, s)
          else:
              s = s.replace("</body>", stamp + "\n</body>")
          p.write_text(s)
          PY
      - name: Commit and push if changed
        run: |
          git config user.name 7not-nico
          git config user.email 7not-nico@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then echo "no change"; else git commit -m "ci: refresh Pages build stamp"; git push; fi
